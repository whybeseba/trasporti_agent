services:

  # n8n: lo strumento per i trigger automatici (cron, webhook, notifiche)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"     # interfaccia web, solo dall'interno
    environment:
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome
      - N8N_SECURE_COOKIE=false   # necessario per l'accesso via http in locale
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # PostgreSQL: il database di tutto il sistema (dati DKV, clienti, log)
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=trasporti
      - POSTGRES_DB=trasporti
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}   # letta dal file .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Adminer: interfaccia web per ispezionare PostgreSQL (stile phpMyAdmin)
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  # Open WebUI: la chat di collaudo collegata al motore vLLM su OVH AI Deploy.
  # Sostituisce il "primo test in chat" che la guida originale faceva con
  # Ollama: qui il modello NON gira su questa macchina, gira su AI Deploy.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"     # raggiungibile solo dall'interno / port-forward
    environment:
      - OPENAI_API_BASE_URL=${VLLM_URL}    # con /v1 finale, dal file .env
      - OPENAI_API_KEY=${VLLM_TOKEN}       # token AI Deploy, dal file .env
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=false                   # banco di prova su localhost, non un servizio
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  open_webui_data:
